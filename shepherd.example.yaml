# Copy to shepherd.yaml (git-ignored) and edit; chmod 600 it, since it can hold a key.
# Real environment variables and .env win over this file. Unknown keys are an error.
access:
  mode: accounts # or open-owner: no sign-in; private network only (docs/self-host-accounts.md)
  signups: true
owner: # open-owner mode only
  email: owner@localhost.invalid
  name: Owner
server:
  api_host: 127.0.0.1
  api_port: 3100
  web_origin: http://127.0.0.1:5173
llm:
  provider: local # local, openrouter, anthropic or deepseek
  base_url: http://127.0.0.1:11434/v1 # local only
  api_key: replace-with-your-key # optional for local
  models: [example-model] # local only
  default_model: example-model
  context_window: 32768 # local only
  max_tokens: 4096 # local only
  # vision_models: [example-model] # local only: models that accept images
  # reasoning_models: [example-model] # local only: models that accept reasoning effort
# Optional: let the assistant read the agents on a herdr dashboard (read tools, plus one approval-gated write tool, herdr_send_input).
# Override with SHEPHERD_HERDR_URL / SHEPHERD_HERDR_TOKEN. The token expires; keep this file chmod 600.
# EXPOSURE: the token is instance-wide, so every bot can read the operator's agent conversations.
# It is therefore refused unless access.mode is open-owner (a single-owner deployment).
# WRITE TOOL: herdr_send_input types text into a LIVE agent terminal (the agent may run commands
# on it). Every call needs a person to approve that exact agent id and text; Always allow, Auto
# Review and Never ask do not pass it, and webhook runs refuse it. Limited to 6 sends a minute
# per user per process (the count is in memory, so each API or worker process has its own). Opening the terminal can displace a dashboard terminal open on that agent.
# http is accepted only for loopback or Tailscale (100.64.0.0/10, fd7a:115c:a1e0::/48, *.ts.net);
# anything else must be https. Prefer an IP literal or a *.ts.net name: an ordinary DNS name can
# be re-pointed between private hosts, and only the address class is checked, not the name.
# herdr:
#   url: http://100.64.0.10:8787
#   token: replace-with-your-bridge-token
